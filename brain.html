<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PRAZE — Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="brain.css">
<script src="brain.js" defer></script>
</head>
<body>

<header class="navbar">
  <span class="navbar__mark">PRAZE — BRAIN</span>
  <a class="navbar__cta" href="index.html">&larr; site</a>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-dismiss" class="banner__dismiss" type="button" aria-label="Dismiss">&times;</button>
</div>

<main class="brain">

  <section class="capture">
    <p class="label">CAPTURE</p>
    <form id="capture-form">
      <input id="capture-title" class="capture__title" type="text" placeholder="Title (optional)" autocomplete="off">
      <textarea id="capture-body" class="capture__body" rows="4" placeholder="What's on your mind?" required></textarea>
      <input id="capture-tags" class="capture__tags" type="text" placeholder="tags: training, content" autocomplete="off">
      <div id="tag-suggest" class="tag-suggest"></div>
      <div class="capture__actions">
        <button class="btn" type="submit">CAPTURE</button>
        <span class="capture__hint">Ctrl/Cmd + Enter</span>
      </div>
    </form>
  </section>

  <section class="toolbar">
    <div class="toolbar__search">
      <input id="search" type="search" placeholder="Search your brain&hellip; ( / )" autocomplete="off">
      <span id="note-count" class="toolbar__count">0 NOTES</span>
    </div>
    <div class="toolbar__actions">
      <button id="export-btn" class="toolbar__btn" type="button">Export</button>
      <button id="import-btn" class="toolbar__btn" type="button">Import</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </section>

  <div id="tag-rail" class="tag-rail"></div>

  <ol id="note-list" class="note-list"></ol>

  <noscript>
    <p class="noscript">This app needs JavaScript — your notes live in this browser, nothing is sent anywhere.</p>
  </noscript>

</main>

<footer class="brain-footer">
  <p>Notes are stored only in this browser (localStorage). No account, no server, no sync — export regularly to keep a backup.</p>
</footer>

</body>
</html>
