/* ---------------- motion / haptics ---------------- */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
/* One vibration helper for every haptic moment (PR, finish, timer,
   destructive confirm). Silent under prefers-reduced-motion. */
function buzz(pattern) {
  if (reducedMotion.matches) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* Two-tap confirm for destructive buttons: first tap arms it, second confirms. */
function armBtn(btn, label = 'SURE?') {
  if (btn.dataset.armed) { buzz(30); return true; }
  btn.dataset.armed = '1';
  btn.dataset.prev = btn.innerHTML;
  btn.innerHTML = label;
  btn.classList.add('armed');
  setTimeout(() => {
    if (!btn.isConnected || !btn.dataset.armed) return;
    delete btn.dataset.armed;
    btn.innerHTML = btn.dataset.prev;
    btn.classList.remove('armed');
  }, 1700);
  return false;
}

/* ================================================================
   PWA: manifest + icons generated at runtime, service worker attempt,
   install prompt. All one file, no external assets.
   ================================================================ */
const isStandalone = () =>
  matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

const pwa = { canInstall: false, swStatus: 'unsupported' };  // swStatus: active|failed|insecure|unsupported
let deferredInstall = null;

/* Icon art: near-black rounded square, the PRAZE lightning bolt in lime.
   Same glyph as the Today tab, drawn on canvas so it needs no font and
   stays crisp from 512px down to 48px. Maskable variant fills the whole
   square and keeps the bolt inside the safe zone. */
function drawIconPNG(size, maskable) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a0b';
  if (maskable) {
    x.fillRect(0, 0, size, size);
  } else {
    const r = size * 0.225;
    x.beginPath();
    x.moveTo(r, 0);
    x.arcTo(size, 0, size, size, r);
    x.arcTo(size, size, 0, size, r);
    x.arcTo(0, size, 0, 0, r);
    x.arcTo(0, 0, size, 0, r);
    x.closePath();
    x.fill();
  }
  const box = size * (maskable ? 0.46 : 0.56);   // glyph bounding box
  const bolt = new Path2D('M13 2 L3 14 L12 14 L11 22 L21 10 L12 10 Z');
  x.save();
  x.translate((size - box) / 2, (size - box) / 2);
  x.scale(box / 24, box / 24);
  x.fillStyle = '#cdff00';
  x.fill(bolt);
  x.restore();
  return c.toDataURL('image/png');
}

function setupPWA() {
  /* Manifest via Blob URL, icons as data URIs inside it. */
  try {
    const i192 = drawIconPNG(192, false);
    const i512 = drawIconPNG(512, false);
    const m512 = drawIconPNG(512, true);
    const pageURL = location.href.split('#')[0];
    const manifest = {
      name: 'PRAZE',
      short_name: 'PRAZE',
      description: 'Log lifts, track PRs, streaks and bodyweight. Built not born.',
      id: pageURL,
      start_url: pageURL,
      scope: pageURL.replace(/[^/]*$/, ''),
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0a0a0b',
      theme_color: '#0a0a0b',
      categories: ['health', 'fitness'],
      icons: [
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: m512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    const mLink = document.createElement('link');
    mLink.rel = 'manifest';
    mLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.head.appendChild(mLink);

    const aLink = document.createElement('link');   // iOS home-screen icon (best effort)
    aLink.rel = 'apple-touch-icon';
    aLink.href = m512;
    document.head.appendChild(aLink);
  } catch (e) { /* canvas blocked — skip quietly */ }

  /* Service worker: caches this page (the whole app shell) cache-first.
     Honest platform note: current Chrome / Safari / Firefox refuse to
     register a service worker from a blob: URL, so this succeeds only in
     environments that allow it. Everywhere else it fails quietly and the
     Settings sheet reports the real status. Needs HTTPS either way. */
  if (!('serviceWorker' in navigator)) {
    pwa.swStatus = 'unsupported';
  } else if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    pwa.swStatus = 'insecure';
  } else {
    try {
      const pageURL = location.href.split('#')[0];
      const src =
        "const CACHE='praze-shell-" + APP_VERSION + "';" +
        "const PAGE='" + pageURL + "';" +
        "self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.add(PAGE)).catch(()=>{}));});" +
        "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});" +
        "self.addEventListener('fetch',e=>{" +
          "if(e.request.mode==='navigate'){e.respondWith(caches.match(PAGE).then(r=>r||fetch(e.request)));return;}" +
          "e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cp=res.clone();caches.open(CACHE).then(c=>c.put(e.request,cp)).catch(()=>{});return res;})));" +
        "});";
      const swURL = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      navigator.serviceWorker.register(swURL)
        .then(() => { pwa.swStatus = 'active'; })
        .catch(() => { pwa.swStatus = 'failed'; });
    } catch (e) { pwa.swStatus = 'failed'; }
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    pwa.canInstall = true;
  });
  window.addEventListener('appinstalled', () => {
    deferredInstall = null;
    pwa.canInstall = false;
    toast('PRAZE installed');
  });
}

/* ================================================================
   Rest timer — slim bar above the nav. Offered after every logged set;
   the suggested duration is per-exercise: the rest you actually used
   last time for that lift, else 180s for compounds / 90s for isolation.
   Presets + custom; pause / skip; gentle vibrate + optional soft beep,
   both silent under prefers-reduced-motion.
   ================================================================ */
const rest = { state: 'hidden', dur: 0, endsAt: 0, remain: 0, timer: 0, forEx: null };
let audioCtx = null;

function ensureAudio() {
  if (audioCtx || !state.settings.restSound || reducedMotion.matches) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { audioCtx = new AC(); if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); }
  } catch (e) {}
}
function beep() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const t = audioCtx.currentTime;
    [[880, 0], [1174.66, 0.22]].forEach(([hz, off]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = hz;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.07, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + off); o.stop(t + off + 0.22);
    });
  } catch (e) {}
}

/* Suggested rest: last duration actually used for this exercise wins,
   otherwise movement type decides (compound 180s, isolation 90s). */
function suggestedRest(name) {
  if (name) {
    const m = metaOf(name);
    if (m && m.rest) return m.rest;
    return isCompound(name) ? 180 : 90;
  }
  return state.settings.restDur;
}

const restEl = () => $('#restbar');
function showRestBar() { restEl().hidden = false; document.body.classList.add('rest-on'); }
function hideRest() {
  clearInterval(rest.timer);
  rest.state = 'hidden';
  const el = restEl();
  el.hidden = true;
  el.innerHTML = '';
  document.body.classList.remove('rest-on');
}

/* Offered after a set: presets, the per-exercise suggestion marked hot. */
function showRestOffer(exName) {
  clearInterval(rest.timer);
  rest.state = 'offer';
  rest.forEx = exName || null;
  const sug = suggestedRest(exName);
  const durs = [60, 90, 120, 180];
  if (!durs.includes(sug)) { durs.push(sug); durs.sort((a, b) => a - b); }
  restEl().innerHTML = `
    <div class="rest-chips">
      <span class="rest-lab">Rest</span>
      ${durs.map(d => `<button class="chip${d === sug ? ' hot' : ''}" data-action="rest-start" data-s="${d}">${d}s</button>`).join('')}
      <button class="chip" data-action="rest-custom" aria-label="Custom rest duration">&hellip;</button>
      <button class="rest-x" style="margin-left:auto" data-action="rest-hide" aria-label="Dismiss rest timer">${I.x}</button>
    </div>`;
  showRestBar();
}

function showRestCustom() {
  rest.state = 'offer';
  restEl().innerHTML = `
    <div class="rest-chips">
      <span class="rest-lab">Rest</span>
      <input class="field" id="rest-custom-s" type="number" inputmode="numeric" min="5" max="3600"
             placeholder="Seconds" style="height:44px;flex:1;min-width:0" aria-label="Rest seconds">
      <button class="rest-btn lime" data-action="rest-start-custom">Start</button>
      <button class="rest-x" data-action="rest-hide" aria-label="Dismiss rest timer">${I.x}</button>
    </div>`;
  showRestBar();
  const el = $('#rest-custom-s');
  if (el) el.focus();
}

function startRest(sec) {
  sec = Math.min(3600, Math.max(5, Math.round(sec)));
  let dirty = false;
  if (state.settings.restDur !== sec) { state.settings.restDur = sec; dirty = true; }
  if (rest.forEx) {                       // remember what this lift actually got
    const m = ensureMeta(rest.forEx);
    if (m.rest !== sec) { m.rest = sec; dirty = true; }
  }
  if (dirty) save();
  ensureAudio();   // created inside the tap so the beep is allowed later
  rest.dur = sec;
  rest.remain = sec * 1000;
  rest.endsAt = Date.now() + rest.remain;
  rest.state = 'running';
  restEl().innerHTML = `
    <div class="rest-fill" id="rest-fill"></div>
    <div class="rest-inner">
      <div>
        <div class="rest-lab">Rest</div>
        <div class="rest-time" id="rest-time">${fmtMMSS(sec)}</div>
      </div>
      <span style="flex:1"></span>
      <button class="rest-btn" data-action="rest-pause" id="rest-pause">Pause</button>
      <button class="rest-btn" data-action="rest-skip">Skip</button>
    </div>`;
  showRestBar();
  clearInterval(rest.timer);
  rest.timer = setInterval(restTick, 200);
  restTick();
}

function restTick() {
  if (rest.state !== 'running') return;
  rest.remain = rest.endsAt - Date.now();
  if (rest.remain <= 0) { finishRest(); return; }
  const t = $('#rest-time'), f = $('#rest-fill');
  if (t) t.textContent = fmtMMSS(Math.ceil(rest.remain / 1000));
  if (f) f.style.width = (100 * (1 - rest.remain / (rest.dur * 1000))).toFixed(1) + '%';
}

function toggleRestPause() {
  const btn = $('#rest-pause');
  if (rest.state === 'running') {
    rest.state = 'paused';
    rest.remain = Math.max(0, rest.endsAt - Date.now());
    if (btn) btn.textContent = 'Resume';
  } else if (rest.state === 'paused') {
    rest.endsAt = Date.now() + rest.remain;
    rest.state = 'running';
    if (btn) btn.textContent = 'Pause';
  }
}

function finishRest() {
  clearInterval(rest.timer);
  rest.state = 'done';
  const f = $('#rest-fill');
  if (f) f.style.width = '100%';
  buzz([120, 90, 120]);
  if (!reducedMotion.matches && state.settings.restSound) beep();
  const inner = $('.rest-inner', restEl());
  if (inner) inner.innerHTML = `
    <div>
      <div class="rest-lab" style="color:var(--lime)">Rest done</div>
      <div class="rest-time">0:00</div>
    </div>
    <span style="flex:1"></span>
    <button class="rest-btn lime" data-action="rest-hide">Back to it</button>`;
  setTimeout(() => { if (rest.state === 'done') hideRest(); }, 5000);
}

/* ================================================================
   Plate calculator — which plates to load PER SIDE, honest about
   remainders: it rounds DOWN to the closest loadable weight and says so
   rather than pretending the target was hit.
   ================================================================ */
const PLATE_SETS = { kg: [25, 20, 15, 10, 5, 2.5, 1.25], lb: [45, 35, 25, 10, 5, 2.5] };
const barWeight = () => unit() === 'lb' ? state.settings.barLb : state.settings.barKg;

/* Greedy load in quarter-unit integer steps (denominations are canonical,
   so greedy is optimal and floats can't drift). Never exceeds the target. */
function platesFor(target, bar, denoms) {
  const per = (target - bar) / 2;
  if (per < -1e-9) return { plates: [], total: bar, belowBar: true };
  let remQ = Math.floor(per * 4 + 1e-6);        // quarter units
  const out = [];
  for (const p of denoms) {
    const q = Math.round(p * 4);
    while (remQ >= q) { out.push(p); remQ -= q; }
  }
  const total = bar + 2 * out.reduce((a, b) => a + b, 0);
  return { plates: out, total, belowBar: false };
}

function openPlates(targetDisp) {
  ui.plateTarget = Math.max(0, Math.round((Number(targetDisp) || 0) * 100) / 100);
  openSheet(`
    <div class="sheet-title">Plate math</div>
    <div id="plate-body"></div>`);
  renderPlateBody();
}

function renderPlateBody() {
  const el = $('#plate-body');
  if (!el) return;
  const u = unit(), target = ui.plateTarget, bar = barWeight();
  const denoms = PLATE_SETS[u];
  const res = platesFor(target, bar, denoms);
  const plateH = p => Math.round(34 + 62 * (p / denoms[0]));

  let result;
  if (!target) {
    result = `<div class="sheet-note" style="margin-top:14px">Type a target weight in the set first, then come back.</div>`;
  } else if (res.belowBar) {
    result = `<div class="sheet-note" style="margin-top:14px">${trimNum(target)} ${u} sits below the ${trimNum(bar)} ${u} bar — it's an empty-bar day.</div>`;
  } else {
    const diff = Math.round((target - res.total) * 100) / 100;
    result = `
      <div class="sleeve" role="img" aria-label="${res.plates.length ? 'Load per side: ' + res.plates.map(trimNum).join(', ') + ' ' + u : 'Empty bar'}">
        <div class="bar-shaft"></div><div class="bar-collar"></div>
        ${res.plates.map(p => `<div class="plate" style="height:${plateH(p)}px"><span>${trimNum(p)}</span></div>`).join('')}
        <div class="bar-tip"></div>
      </div>
      <div class="sheet-note" style="margin-top:0">${res.plates.length
        ? 'Per side: <b style="color:var(--bone)">' + res.plates.map(trimNum).join(' + ') + '</b> ' + u
        : 'No plates — just the bar.'}</div>
      ${diff > 0
        ? `<div class="plate-total" style="margin-top:12px">${trimNum(res.total)} <span class="u">${u} · closest</span></div>
           <div class="sheet-note">Standard plates can't hit ${trimNum(target)} ${u} exactly — this lands ${trimNum(diff)} ${u} under, never over.</div>`
        : `<div class="sheet-note">Loads exactly to target.</div>`}`;
  }

  el.innerHTML = `
    <div class="slab" style="margin-top:4px">Target</div>
    <div class="plate-total">${trimNum(target)} <span class="u">${u}</span></div>
    <div class="slab" style="margin-top:16px">Bar weight · ${u}</div>
    <div class="step-row sm">
      <button data-action="bar-step" data-d="${u === 'lb' ? -5 : -2.5}" aria-label="Decrease bar weight">&minus;</button>
      <div class="num" aria-live="polite">${trimNum(bar)}</div>
      <button data-action="bar-step" data-d="${u === 'lb' ? 5 : 2.5}" aria-label="Increase bar weight">+</button>
    </div>
    ${result}`;
}

/* ================================================================
   Finish celebration — confetti (lime + bone), a check that draws in,
   and stats counting up. All of it skipped under prefers-reduced-motion:
   the summary then renders exactly as the static card it always was.
   No new sound — the finish reuses the existing rest-timer beep().
   ================================================================ */
function confettiBurst() {
  if (reducedMotion.matches) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d');
  if (!ctx) { c.remove(); return; }
  ctx.scale(dpr, dpr);
  const colors = ['#cdff00', '#f2efe6', '#cdff00', 'rgba(205,255,0,.65)', 'rgba(242,239,230,.7)'];
  const parts = [];
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.7;   // mostly upward fan
    const sp = 6 + Math.random() * 9;
    parts.push({
      x: W / 2, y: H * 0.4,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      s: 3 + Math.random() * 4.5,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35,
      col: colors[i % colors.length]
    });
  }
  const t0 = performance.now(), LIFE = 1700;
  (function frame(now) {
    const age = now - t0;
    ctx.clearRect(0, 0, W, H);
    if (age >= LIFE || !c.isConnected) { c.remove(); return; }
    const fade = Math.max(0, 1 - age / LIFE);
    for (const p of parts) {
      p.vy += 0.33; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 20) continue;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  })(t0);
}

/* Eases 0→1 (cubic out) and hands progress to a formatter every frame. */
function animateCount(el, fmt, dur = 950) {
  if (!el) return;
  const t0 = performance.now();
  (function tick(now) {
    const t = Math.min(1, (now - t0) / dur);
    el.textContent = fmt(t === 1 ? 1 : 1 - Math.pow(1 - t, 3));
    if (t < 1) requestAnimationFrame(tick);
  })(t0);
}

/* Runs after renderToday() has put the celebrate-mode summary in the DOM. */
function runCelebration(w) {
  if (reducedMotion.matches) return;   // the static summary IS the fallback
  confettiBurst();
  const tot = sessionTotals(w);
  const prCount = sessionPRs(w).length;
  const durMs = w.startedAt && w.endedAt && w.endedAt > w.startedAt ? w.endedAt - w.startedAt : 0;
  const cell = k => $('#view-today .summary-card .cnt[data-k="' + k + '"]');
  if (durMs) animateCount(cell('dur'), p => fmtDur(durMs * p));
  animateCount(cell('sets'), p => Math.round(tot.sets * p));
  animateCount(cell('vol'), p => fmtInt(toDisp(tot.volume) * p));
  animateCount(cell('prs'), p => Math.round(prCount * p));
}

/* ---------------- view: Today ---------------- */
function renderToday() {
  const date = ui.sessionDate;
  const w = getWorkout(date);
  const wk = weekStats();
  const isToday = date === todayStr();
  const goal = state.settings.weeklyGoal;
  const streak = currentStreak();
  const prsWk = weekPRCount();
  const firstDay = firstWorkoutDate();
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  let html = `
    <div class="hero">
      <div class="date">${greet} · ${fmtLong(todayStr())}</div>
      <h1 class="display">Built<br>Not <span class="lime">Born</span></h1>
    </div>

    <div class="eyebrow">This week <span class="spacer"></span>
      <span class="mini">${fmtShort(dayToStr(wk.start))} – ${fmtShort(dayToStr(new Date(wk.end - 864e5)))}</span>
    </div>
    <div class="trio quad" style="margin-bottom:8px">
      <div class="card"><div class="stat-num">${wk.sessions}</div><div class="stat-lab">Sessions</div></div>
      <div class="card"><div class="stat-num">${streak}</div><div class="stat-lab">Wk streak</div></div>
      <div class="card"><div class="stat-num"${prsWk > 0 ? ' style="color:var(--lime)"' : ''}>${prsWk}</div><div class="stat-lab">New PRs</div></div>
      <div class="card"><div class="stat-num">${fmtInt(toDisp(wk.volume))}</div><div class="stat-lab">${unit()} volume</div></div>
    </div>
    <div class="card">
      <div class="slab">Weekly goal</div>
      <span class="bar"><i style="width:${Math.min(100, wk.sessions / goal * 100).toFixed(1)}%"></i></span>
      <div class="bar-cap">${wk.sessions} of ${goal} sessions${wk.sessions >= goal ? ' · <span class="lime">goal hit</span>' : ''}</div>
    </div>
    <button class="card journey-cta" data-action="open-journey" aria-label="Open your journey">
      <div style="flex:1;min-width:0">
        <div class="tpl-name">Your <span style="color:var(--lime)">journey</span></div>
        <div class="hint" style="margin-top:3px">${firstDay ? 'The story since ' + fmtShort(firstDay) : 'Your story starts with the first set'}</div>
      </div>
      <span class="chev" aria-hidden="true">&rsaquo;</span>
    </button>`;

  /* Momentum: suggested next template + last workout recap. */
  const lastW = [...state.workouts].filter(hasLoggedSets).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const sug = suggestedTemplate();
  if (lastW || sug) {
    html += `<div class="eyebrow">Up next</div>`;
    if (sug) {
      html += `<div class="card">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1;min-width:0">
            <div class="tpl-name">${esc(sug.name)}</div>
            <div class="hint">${sug.lastUsed ? 'Last trained ' + fmtShort(sug.lastUsed) : 'Never trained yet'} · longest wait in your split</div>
          </div>
          <button class="btn primary sm" style="width:92px;flex:none" data-action="start-template" data-id="${sug.id}">Start</button>
        </div>
      </div>`;
    }
    if (lastW) {
      const lt = sessionTotals(lastW);
      html += `<div class="card">
        <div class="slab">Last workout</div>
        <div class="list-val">${fmtLong(lastW.date)}</div>
        <div class="hint" style="margin-top:3px">${lt.exercises} exercise${lt.exercises === 1 ? '' : 's'} · ${lt.sets} sets · ${fmtInt(toDisp(lt.volume))} ${unit()}${
          lastW.startedAt && lastW.endedAt && lastW.endedAt > lastW.startedAt ? ' · ' + fmtDur(lastW.endedAt - lastW.startedAt) : ''}</div>
      </div>`;
    }
  }

  html += `
    <div class="eyebrow">Session</div>
    <div class="daterow">
      <button class="nav-arrow" data-action="date-shift" data-d="-1" aria-label="Previous day">${I.left}</button>
      <input type="date" class="field" id="session-date" value="${date}" max="2100-12-31">
      <button class="nav-arrow" data-action="date-shift" data-d="1" aria-label="Next day">${I.right}</button>
    </div>
    ${isToday ? '' : '<button class="chip today-jump" data-action="date-today">Jump to today</button>'}`;

  const active = w && hasLoggedSets(w);
  if (active && w.endedAt) html += summaryCard(w, ui.celebrate === w.id);

  if (!w || !w.exercises.length) {
    // Empty session: offer templates as one-tap starts.
    html += `<div class="card ex-card">
      <div class="hint">Nothing logged for ${isToday ? 'today' : 'this day'}.</div>
      ${state.templates.length ? `
        <div class="slab" style="margin-top:14px">Start from a template</div>
        <div class="chips">${state.templates.map(t =>
          `<button class="chip" data-action="start-template" data-id="${t.id}">${esc(t.name)}</button>`).join('')}
        </div>` : ''}
    </div>`;
  } else {
    /* One-time discoverability hint for set-type tagging: shown under the
       first card with sets, and only until the user has ever tagged one. */
    const neverTagged = !state.workouts.some(x => x.exercises.some(e => e.sets.some(s => s.t && s.t !== 'working')));
    let hinted = false;
    html += w.exercises.map(ex => {
      const showHint = neverTagged && !hinted && ex.sets.length > 0;
      if (showHint) hinted = true;
      return exerciseCard(ex, date, showHint);
    }).join('');
  }

  html += `<button class="btn ghost" style="margin-top:12px" data-action="open-add-exercise">${I.plus} Add exercise</button>`;
  if (active && !w.endedAt)
    html += `<button class="btn primary" style="margin-top:10px" data-action="finish-workout">${I.flag} Finish workout</button>`;
  if (w && w.exercises.length)
    html += `<button class="linkish" data-action="save-as-template">Save this session as a template</button>`;
  html += `<button class="linkish" data-action="open-templates">Manage templates</button>`;

  $('#view-today').innerHTML = html;
  ui.justLogged = null;
  ui.celebrate = null;   // the moment plays once; later renders stay static
}

/* The template that's waited longest — never-used ones first. */
function suggestedTemplate() {
  if (!state.templates.length) return null;
  return [...state.templates].sort((a, b) => {
    if (!a.lastUsed && !b.lastUsed) return 0;
    if (!a.lastUsed) return -1;
    if (!b.lastUsed) return 1;
    return a.lastUsed < b.lastUsed ? -1 : 1;
  })[0];
}

/* Finish-workout summary — rendered while the session stays finished.
   celebrate=true (only right after Finish is tapped, and never under
   reduced motion) adds the draw-in check + count-up hooks; every later
   render is the same card, static. */
function summaryCard(w, celebrate) {
  const tot = sessionTotals(w);
  const dur = w.startedAt && w.endedAt && w.endedAt > w.startedAt ? fmtDur(w.endedAt - w.startedAt) : null;
  const prs = sessionPRs(w);

  let cells = '';
  if (dur) cells += `<div><div class="stat-num cnt" data-k="dur">${dur}</div><div class="stat-lab">Duration</div></div>`;
  cells += `
    <div><div class="stat-num">${tot.exercises}</div><div class="stat-lab">Exercises</div></div>
    <div><div class="stat-num cnt" data-k="sets">${tot.sets}</div><div class="stat-lab">Sets</div></div>
    <div><div class="stat-num cnt" data-k="vol">${fmtInt(toDisp(tot.volume))}</div><div class="stat-lab">${unit()} work volume</div></div>
    <div><div class="stat-num cnt" data-k="prs">${prs.length}</div><div class="stat-lab">New PRs</div></div>`;

  const prHtml = prs.map(p => `
    <div class="pr-card">
      <span class="pr-tag">PR</span>
      <div class="pr-card-main">
        <div class="pr-card-name">${esc(p.name)}</div>
        <div class="hint">was ${dispW(p.prev)} ${unit()} · e1RM now ${dispW(e1rm(p.w, p.r))} ${unit()}</div>
      </div>
      <div class="pr-top">${dispW(p.w)} ${unit()} × ${p.r}</div>
    </div>`).join('');

  let deltaHtml = '';
  const cmp = comparableSession(w);
  if (cmp) {
    const p = sessionTotals(cmp);
    const parts = [];
    if (p.volume > 0) parts.push('Volume ' + signed(Math.round((tot.volume - p.volume) / p.volume * 100)) + '%');
    parts.push('Reps ' + signed(tot.reps - p.reps));
    parts.push('Top weight ' + signed(Math.round((toDisp(tot.topW) - toDisp(p.topW)) * 10) / 10) + ' ' + unit());
    deltaHtml = `<div class="sum-delta hint">vs ${fmtShort(cmp.date)} — ${parts.join(' · ')}</div>`;
  }

  return `
  <div class="card summary-card${celebrate && !reducedMotion.matches ? ' celebrate' : ''}" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <svg class="check-draw" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="23" fill="none" stroke="rgba(205,255,0,.4)" stroke-width="2.5"/>
        <path d="M15.5 27l7.5 7.5 14-15" fill="none" stroke="#cdff00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sum-title">Workout <span class="lime">complete</span></div>
    </div>
    <div class="sum-grid">${cells}</div>
    ${prHtml ? `<div style="margin-top:12px">${prHtml}</div>` : ''}${deltaHtml}
    <div class="hint" style="margin-top:12px">Log another set to reopen this session.</div>
  </div>`;
}

function exerciseCard(ex, date, typeHint) {
  const prev = prevSessionSets(ex.name, date);
  const hint = prev
    ? 'Last time · ' + prev.sets.slice(0, 4).map(s => dispW(s.w) + '×' + s.r + setMark(s)).join(' · ') + (prev.sets.length > 4 ? ' …' : '')
    : '';
  const pre = lastSetAnywhere(ex.name, date);   // prefill inputs with the most recent set

  /* The badge cycles the set type; the row body still opens inline edit. */
  const rows = ex.sets.map((s, i) => {
    if (ui.editSet && ui.editSet.exId === ex.id && ui.editSet.i === i) return setEditRow(s, i);
    const ty = SET_TYPES.includes(s.t) ? s.t : 'working';
    return `
    <div class="set-row${ui.justLogged === ex.id + ':' + i ? ' new' : ''}${ty === 'warmup' ? ' warmup' : ''}">
      <button class="set-i st-${ty}" data-action="cycle-set-type" data-i="${i}"
              aria-label="Set ${i + 1} type: ${ty === 'working' ? 'working' : ty === 'warmup' ? 'warm-up' : ty === 'drop' ? 'drop set' : 'to failure'}. Tap to change">${SET_GLYPH[ty] || i + 1}</button>
      <button class="set-main" data-action="edit-set" data-i="${i}" aria-label="Edit set ${i + 1}">
        <span class="set-v">${dispW(s.w)} ${unit()} <span class="x">×</span> ${s.r}</span>
      </button>
      <button class="set-del" data-action="del-set" data-i="${i}" aria-label="Delete set ${i + 1}">${I.x}</button>
    </div>`;
  }).join('');

  return `
  <div class="card ex-card" data-ex="${ex.id}">
    <div class="ex-head">
      <div>
        <button class="ex-name" data-action="open-ex" data-name="${esc(ex.name)}" aria-label="History for ${esc(ex.name)}">${esc(ex.name)}<span class="chev">&rsaquo;</span></button>
        ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      </div>
      <button class="ex-del" data-action="del-exercise" aria-label="Remove ${esc(ex.name)}">${I.x}</button>
    </div>
    <div class="sets">${rows || '<div class="hint pad">No sets yet. First one below.</div>'}</div>
    ${typeHint ? '<div class="hint" style="padding:6px 2px 0;font-size:11px">Tap a set badge to mark warm-up (W), drop (D) or failure (+). Warm-ups stay out of PRs and volume.</div>' : ''}
    <div class="log-grid">
      <div>
        <div class="slab slab-row">Weight · ${unit()}
          <button class="plate-btn" data-action="open-plates" aria-label="Plate calculator">${I.disc}</button>
        </div>
        <div class="step-row">
          <button data-action="step" data-d="${-wStep()}" aria-label="Minus ${wStep()} ${unit()}">&minus;</button>
          <input class="num w" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="${pre ? dispW(pre.w) : ''}">
          <button data-action="step" data-d="${wStep()}" aria-label="Plus ${wStep()} ${unit()}">+</button>
        </div>
      </div>
      <div>
        <div class="slab">Reps</div>
        <div class="step-row">
          <button data-action="step" data-d="-1" aria-label="Minus 1 rep">&minus;</button>
          <input class="num r" type="number" inputmode="numeric" step="1" min="0" placeholder="0" value="${pre ? pre.r : ''}">
          <button data-action="step" data-d="1" aria-label="Plus 1 rep">+</button>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost sm" data-action="repeat-set" style="height:54px">Repeat last</button>
      <button class="btn primary" data-action="log-set">Log set</button>
    </div>
  </div>`;
}

/* ---------------- view: Calendar ---------------- */
function renderCalendar() {
  if (ui.calY === null) { const t = new Date(); ui.calY = t.getFullYear(); ui.calM = t.getMonth(); }
  const y = ui.calY, m = ui.calM;
  const startIdx = (new Date(y, m, 1).getDay() + 6) % 7;      // Monday-start offset
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayStr();

  const trained = new Set();
  let monthSessions = 0, monthVol = 0;
  for (const w of state.workouts) {
    if (!hasLoggedSets(w)) continue;
    trained.add(w.date);
    const d = parseDay(w.date);
    if (d.getFullYear() === y && d.getMonth() === m) {
      monthSessions++;
      for (const ex of w.exercises) for (const s of ex.sets) if (!isWarmup(s)) monthVol += s.w * s.r;
    }
  }

  let cells = '';
  for (let i = 0; i < startIdx; i++) cells += '<div class="cal-blank"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + '-' + pad2(m + 1) + '-' + pad2(d);
    const cls = 'cal-day' + (trained.has(ds) ? ' has' : '') + (ds === today ? ' today' : '');
    cells += `<button class="${cls}" data-action="cal-day" data-date="${ds}" aria-label="${fmtLong(ds)}${trained.has(ds) ? ', workout logged' : ''}">${d}</button>`;
  }

  $('#view-calendar').innerHTML = `
    <div class="eyebrow" style="margin-top:26px">Calendar</div>
    <div class="cal-head">
      <button class="cal-arrow" data-action="cal-shift" data-d="-1" aria-label="Previous month">${I.left}</button>
      <div class="cal-title">${MONTHS_FULL[m]} ${y}</div>
      <button class="cal-arrow" data-action="cal-shift" data-d="1" aria-label="Next month">${I.right}</button>
    </div>
    <div class="card">
      <div class="cal-dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="stat-grid" style="margin-top:10px">
      <div class="card"><div class="stat-num">${monthSessions}</div><div class="stat-lab">Sessions</div></div>
      <div class="card"><div class="stat-num">${fmtInt(toDisp(monthVol))}</div><div class="stat-lab">${unit()} volume</div></div>
    </div>
    <div class="hint" style="margin-top:12px;text-align:center">Tap a lit day to open that session.</div>`;
}

/* Shared exercise chart card (Progress + history drill-in): a top-set /
   estimated-1RM toggle over the interactive line chart. Every dot carries
   the exact set behind it for the tap tooltip. */
function exChartHTML(name) {
  const spts = exSeries(name);
  if (!spts.length) return `<div class="card chart-wrap">${chartSVG([])}</div>`;
  const mode = ui.chartMode;
  const cpts = spts.map(p => {
    const s = mode === 'e1rm' ? p.e.s : p.top;
    const v = mode === 'e1rm' ? p.e.v : p.top.w;
    return {
      d: p.d,
      v: Math.round(toDisp(v) * 10) / 10,
      tip: dispW(s.w) + ' ' + unit() + ' × ' + s.r,
      sub: fmtShort(p.d) + ' · e1RM ' + dispW(e1rm(s.w, s.r)) + ' ' + unit()
    };
  });
  return `
    <div class="card chart-wrap">
      <div class="seg chart-seg" role="group" aria-label="Chart metric">
        <button data-action="chart-mode" data-m="top" class="${mode === 'top' ? 'on' : ''}" aria-pressed="${mode === 'top'}">Top set</button>
        <button data-action="chart-mode" data-m="e1rm" class="${mode === 'e1rm' ? 'on' : ''}" aria-pressed="${mode === 'e1rm'}">Est. 1RM</button>
      </div>
      ${chartSVG(cpts, { interactive: true })}
      <div class="hint" style="padding:4px 6px 6px;font-size:11px">Tap a dot for the exact set behind it.</div>
    </div>`;
}

/* ---------------- view: Records ---------------- */
function renderRecords() {
  const tot = lifetimeTotals(state);
  let html = `

      <div class="card"><div class="stat-num">${tot.workouts}</div><div class="stat-lab">Workouts</div></div>

    <div class="card">
      <div class="slab">Milestones</div>
      <div class="badges">
        ${MILESTONES.map(d => `
          <div class="badge${milestoneHit(d, tot) ? ' on' : ''}" role="img"
               aria-label="${d.lab}${milestoneHit(d, tot) ? ', unlocked' : ', locked'}">
            <b>${d.b}</b><span>${d.t}</span>

  const withPRs = knownExercises()
    .map(n => ({ name: n, pr: prInfo(n) }))
    .filter(x => x.pr);

  if (!withPRs.length) {
    html += `<div class="card"><div class="hint">No records yet. Every set you log is a shot at outlifting your past self — the first PR lands here.</div></div>`;
    $('#view-records').innerHTML = html;

  /* Group by muscle, in the canonical order, untagged last. */
  const groups = new Map();
  for (const x of withPRs) {

    if (!groups.has(m)) groups.set(m, []);
    groups.get(m).push(x);

  const order = [...MUSCLES, 'Other'].filter(m => groups.has(m));

  for (const m of order) {
    const rows = groups.get(m).sort((a, b) => b.pr.best.w - a.pr.best.w);
    html += `
      <div class="eyebrow">${esc(m)}</div>
      <div class="card">

}

/* ================================================================
   The "Built Not Born" journey — a full-screen scrolling story of the
   transformation. Everything on it derives at runtime; nothing new is
   persisted. Reached from the dashboard, never from the tab bar.
   ================================================================ */
function journeyStats() {
  const tot = lifetimeTotals(state);
  let workSets = 0, strongest = null;
  for (const w of state.workouts)
    for (const ex of w.exercises)
      for (const s of ex.sets) {
        if (isWarmup(s)) continue;
        workSets++;
        if (s.w > 0 && (!strongest || s.w > strongest.w || (s.w === strongest.w && s.r > strongest.r)))
          strongest = { name: ex.name, w: s.w, r: s.r, date: w.date };
      }
  return { workouts: tot.workouts, kg: tot.kg, tonnes: tot.tonnes, workSets, strongest };
}

const fmtDMY = s => { const d = parseDay(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const jp = (cls, inner) => `<div class="jpanel${cls ? ' ' + cls : ''}">${inner}</div>`;

function renderJourney() {
  const first = firstWorkoutDate();
  const st = journeyStats();
  const panels = [];

  /* 1 · title */
  panels.push(jp('', `
    <div class="j-lab">The story so far</div>
    <div class="j-num">Your<br><span class="lime">journey</span></div>
    <div class="j-sub">${first ? fmtDMY(first) + ' — today.' : 'It starts the day you log the first set.'}</div>
    <div class="j-scroll" aria-hidden="true">Scroll</div>`));

  if (st.workouts < 3) {
    /* early state: no broken stats, just the invitation */
    panels.push(jp('', `
      <div class="j-lab">Chapter one</div>
      <div class="j-num">Keep<br><span class="lime">logging</span></div>
      <div class="j-sub">${st.workouts === 0
        ? 'This page becomes the story of your transformation — bodyweight, tonnage, streaks, your strongest lift. Log a workout and the numbers start talking.'
        : st.workouts + ' workout' + (st.workouts === 1 ? '' : 's') + ' in the book. A few more sessions and this page starts telling a story worth scrolling.'}</div>`));
  } else {
    /* 2 · bodyweight (only with at least two entries) */
    const bw = [...state.bodyweight].sort((a, b) => a.date < b.date ? -1 : 1);
    if (bw.length >= 2) {
      const s0 = bw[0], s1 = bw[bw.length - 1];
      const delta = Math.round((toDisp(s1.kg) - toDisp(s0.kg)) * 10) / 10;
      panels.push(jp('', `
        <div class="j-lab">Bodyweight</div>
        <div class="j-num j-sm"><span class="j-dim">${dispW(s0.kg)}</span> &rarr; <span class="lime">${dispW(s1.kg)}</span> <span class="j-unit">${unit()}</span></div>
        <div class="j-sub">${(delta >= 0 ? '+' : '') + delta} ${unit()} between ${fmtDMY(s0.date)} and ${fmtDMY(s1.date)}. The scale kept the receipts.</div>`));
    }

    /* 3 · workouts */
    panels.push(jp('', `
      <div class="j-lab">Showed up</div>
      <div class="j-num"><span class="lime">${fmtInt(st.workouts)}</span> <span class="j-unit">workouts</span></div>
      <div class="j-sub">Every one of them logged. Nobody was watching — you went anyway.</div>`));

    /* 4 · working sets */
    panels.push(jp('', `
      <div class="j-lab">Working sets</div>
      <div class="j-num"><span class="lime">${fmtInt(st.workSets)}</span> <span class="j-unit">sets</span></div>
      <div class="j-sub">Warm-ups not included. These are the ones that counted.</div>`));

    /* 5 · tonnage — the hero number */
    panels.push(jp('j-hero', `
      <div class="j-lab">Total weight moved</div>
      <div class="j-num${String(Math.round(toDisp(st.kg))).length > 6 ? ' j-sm' : ''}"><span class="lime">${fmtInt(toDisp(st.kg))}</span> <span class="j-unit">${unit()}</span></div>
      <div class="j-sub">${trimNum(Math.round(st.tonnes * 10) / 10)} tonnes, lifted one working set at a time. No shortcut carries that.</div>`));

    /* 6 · streaks */
    const longest = longestStreak(), cur = currentStreak();
    panels.push(jp('', `
      <div class="j-lab">Longest streak</div>
      <div class="j-num"><span class="lime">${longest}</span> <span class="j-unit">${longest === 1 ? 'week' : 'weeks'}</span></div>
      <div class="j-sub">Consecutive training weeks at your best. Current streak: ${cur} ${cur === 1 ? 'week' : 'weeks'}${cur >= longest && cur > 0 ? ' — <span class="lime">this is the one</span>' : ''}.</div>`));

    /* 7 · strongest lift */
    if (st.strongest) {
      const s = st.strongest;
      panels.push(jp('', `
        <div class="j-lab">Strongest lift</div>
        <div class="j-name">${esc(s.name)}</div>
        <div class="j-num j-sm"><span class="lime">${dispW(s.w)}</span> <span class="j-unit">${unit()} × ${s.r}</span></div>
        <div class="j-sub">Estimated 1RM ${dispW(e1rm(s.w, s.r))} ${unit()} · set ${fmtDMY(s.date)}. The heaviest working set you've ever put down.</div>`));
    }
  }

  /* closing wordmark */
  panels.push(jp('', `
    <div class="j-num">Built<br><span class="lime">not</span><br>born</div>
    <button class="btn ghost" style="margin-top:36px;max-width:280px" data-action="nav" data-view="today">Back to training</button>`));

  $('#view-journey').innerHTML = `
    <button class="back-row" data-action="nav" data-view="today">${I.left} Back to Today</button>
    ${panels.join('')}`;
  armJourneyPanels();
}

/* Fade-and-rise each panel as it enters the viewport. Reduced motion (or
   no IntersectionObserver) marks everything seen immediately instead. */
let journeyIO = null;
function armJourneyPanels() {
  const panels = $$('#view-journey .jpanel');
  if (journeyIO) { journeyIO.disconnect(); journeyIO = null; }
  if (reducedMotion.matches || !('IntersectionObserver' in window)) {
    panels.forEach(p => p.classList.add('seen'));
    return;
  }
  journeyIO = new IntersectionObserver(entries => {
    for (const en of entries)
      if (en.isIntersecting) { en.target.classList.add('seen'); journeyIO.unobserve(en.target); }
  }, { threshold: 0.22 });
  panels.forEach(p => journeyIO.observe(p));
}

  const known = knownExercises().filter(n => !inDraft.has(n.toLowerCase().trim())).slice(0, 10);
  $('#tpl-body').innerHTML = `
    <div>${d.exercises.map((n, i) => `
      <div class="list-row">
        <span class="list-val" style="flex:1">${esc(n)}</span>
        <button class="set-del" data-action="tpl-remove" data-i="${i}" aria-label="Remove ${esc(n)}">${I.x}</button>
      </div>`).join('') || '<div class="hint pad">Nothing in it yet.</div>'}
    </div>
    <div style="display:grid;grid-template-columns:1fr 92px;gap:8px;margin-top:10px">
      <input class="field" id="tpl-add-input" placeholder="Add exercise" autocomplete="off" autocapitalize="words">
      <button class="btn ghost sm" style="height:54px" data-action="tpl-add">Add</button>
    </div>
    ${known.length ? `<div class="chips" style="margin-top:10px">${known.map(n =>
      `<button class="chip" data-action="tpl-chip" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}`;
}

/* Keep whatever's typed in the name field before the body re-renders. */
function syncTplName() { const el = $('#tpl-name'); if (el && ui.tplDraft) ui.tplDraft.name = el.value; }

/* ---------------- settings sheet ---------------- */
function storageNote() {
  if (store.mode === 'idb')
    return 'Everything saves automatically on this device. Export a backup before switching phones or clearing site data.';
  if (store.mode === 'local')
    return "Saving to this browser's local storage. Export a backup before clearing your cache.";
  return 'Storage is blocked in this environment, so data lives in memory and disappears on refresh. Open the file in your phone or laptop browser and it saves properly.';
}
function offlineNote() {
  if (isStandalone()) return 'Running as an installed app.';
  switch (pwa.swStatus) {
    case 'active':   return 'Offline cache is on.';
    case 'insecure': return 'To install PRAZE as an app, open this page over HTTPS — any static host works.';
    case 'failed':   return 'This browser refuses offline caching from a single file. The app still works offline while the file is on your device.';
    default:         return '';
  }
}

function openSettings() {
  const u = unit();
  const snd = state.settings.restSound;
  const oled = state.settings.oled;
  const showInstall = pwa.canInstall && !isStandalone();
  const off = offlineNote();
  openSheet(`
    <div class="sheet-title">Settings</div>

    <div class="slab">Units</div>
    <div class="seg" role="group" aria-label="Weight units">
      <button data-action="set-unit" data-u="kg" class="${u === 'kg' ? 'on' : ''}" aria-pressed="${u === 'kg'}">kg</button>
      <button data-action="set-unit" data-u="lb" class="${u === 'lb' ? 'on' : ''}" aria-pressed="${u === 'lb'}">lb</button>
    </div>

    <div class="slab">Weekly session goal</div>
    <div class="step-row sm">
      <button data-action="goal-step" data-d="-1" aria-label="Decrease weekly goal">&minus;</button>
      <div class="num" id="goal-num" aria-live="polite">${state.settings.weeklyGoal}</div>
      <button data-action="goal-step" data-d="1" aria-label="Increase weekly goal">+</button>
    </div>

    <div class="slab">Rest timer sound</div>
    <div class="seg" role="group" aria-label="Rest timer sound">
      <button data-action="set-sound" data-v="1" class="${snd ? 'on' : ''}" aria-pressed="${snd}">On</button>
      <button data-action="set-sound" data-v="0" class="${snd ? '' : 'on'}" aria-pressed="${!snd}">Off</button>
    </div>

    <div class="slab">OLED pure black</div>
    <div class="seg" role="group" aria-label="OLED pure black background">
      <button data-action="set-oled" data-v="1" class="${oled ? 'on' : ''}" aria-pressed="${oled}">On</button>
      <button data-action="set-oled" data-v="0" class="${oled ? '' : 'on'}" aria-pressed="${!oled}">Off</button>
    </div>

    <div class="slab">Data &amp; backup</div>
    <div class="sheet-note" style="margin-top:0">${storageNote()}</div>
    <button class="btn ghost" style="margin-top:14px" data-action="export-json">${I.down} Export JSON</button>
    <button class="btn ghost" style="margin-top:10px" data-action="import-json">${I.up} Import JSON</button>
    <div class="sheet-note">Importing replaces everything currently in the app.</div>

    ${showInstall ? `<button class="btn primary" style="margin-top:18px" data-action="install-app">Install PRAZE</button>` : ''}
    ${off ? `<div class="sheet-note">${off}</div>` : ''}

    <div class="sheet-note" style="text-align:center;letter-spacing:.18em;color:var(--dim);margin-top:22px">PRAZE · v${APP_VERSION} — BUILT NOT BORN</div>`);
}

/* OLED swaps the canvas to pure black; the status-bar color follows. */
function applyTheme() {
  document.documentElement.classList.toggle('oled', state.settings.oled);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = state.settings.oled ? '#000000' : '#0a0a0b';
}

/* ---------------- export / import ---------------- */
function exportJSON() {
  const blob = new Blob(
    [JSON.stringify({ app: 'PRAZE', exported: new Date().toISOString(), ...state }, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'praze-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup exported');
}

function handleImportFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      state = normalize(JSON.parse(reader.result));
      save();
      applyTheme();
      closeSheet();
      render();
      toast('Backup imported');
    } catch (e) {
      toast("Couldn't read that file — is it a PRAZE export?");
    }
  };
  reader.readAsText(file);
}

/* ---------------- one delegated click handler ---------------- */
document.addEventListener('click', e => {
  if (!state) return;   // boot() hasn't finished loading yet
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const card = t.closest('.ex-card');
  const exId = card ? card.dataset.ex : null;
  const w = getWorkout(ui.sessionDate);
  const ex = w && exId ? w.exercises.find(x => x.id === exId) : null;

  switch (t.dataset.action) {

    case 'nav': setView(t.dataset.view); break;
    case 'open-settings': openSettings(); break;
    case 'close-sheet': closeSheet(); break;

    /* ---- drill-ins ---- */
    case 'open-ex': openExHistory(t.dataset.name); break;
    case 'drill-back': setView(ui.exBack || 'today'); break;
    case 'open-templates': showView('templates'); break;
    case 'open-journey': showView('journey'); break;

    /* ---- session date ---- */
    case 'date-shift': {
      const d = parseDay(ui.sessionDate);
      d.setDate(d.getDate() + Number(t.dataset.d));
      ui.sessionDate = dayToStr(d);
      ui.editSet = null;
      renderToday();
      break;
    }
    case 'date-today': ui.sessionDate = todayStr(); ui.editSet = null; renderToday(); break;

    /* ---- steppers (shared by weight, reps, bodyweight, set editor) ---- */
    case 'step': {
      const input = $('input.num', t.closest('.step-row'));
      if (!input) break;
      const delta = Number(t.dataset.d);
      const cur = parseFloat(input.value) || 0;
      input.value = trimNum(Math.max(0, cur + delta));
      break;
    }

    /* ---- logging sets ---- */
    case 'log-set': {
      if (!ex) break;
      const wt = fromDisp(parseFloat($('.num.w', card).value) || 0);
      const reps = Math.round(parseFloat($('.num.r', card).value) || 0);
      if (reps < 1) { toast('Reps first'); break; }
      const prior = maxWeightEver(ex.name);        // PR bar, measured before the push
      if (!w.startedAt && ui.sessionDate === todayStr()) w.startedAt = Date.now();
      w.endedAt = null;                            // logging into a finished session reopens it
      ex.sets.push({ w: wt, r: reps, t: 'working' });
      ui.justLogged = ex.id + ':' + (ex.sets.length - 1);
      ui.editSet = null;
      save();
      renderToday();
      if (prior > 0 && wt > prior) {
        buzz([60, 50, 60, 50, 120]);
        toast('NEW PR — ' + dispW(wt) + ' ' + unit() + ' × ' + reps + ' · was ' + dispW(prior) + ' ' + unit());
      } else {
        toast('Set ' + ex.sets.length + ' · ' + dispW(wt) + ' ' + unit() + ' × ' + reps);
      }
      checkMilestones();
      showRestOffer(ex.name);
      break;
    }
    case 'repeat-set': {
      if (!ex) break;
      const lastSet = lastSetAnywhere(ex.name, ui.sessionDate);
      if (!lastSet) { toast('No previous set for this yet'); break; }
      if (!w.startedAt && ui.sessionDate === todayStr()) w.startedAt = Date.now();
      w.endedAt = null;
      ex.sets.push({ w: lastSet.w, r: lastSet.r, t: 'working' });
      ui.justLogged = ex.id + ':' + (ex.sets.length - 1);
      ui.editSet = null;
      save();
      renderToday();
      toast('Repeated · ' + dispW(lastSet.w) + ' ' + unit() + ' × ' + lastSet.r);
      checkMilestones();
      showRestOffer(ex.name);
      break;
    }
    case 'del-set': {
      if (!ex) break;
      ex.sets.splice(Number(t.dataset.i), 1);
      ui.editSet = null;
      save();
      renderToday();
      break;
    }
    case 'del-exercise': {
      if (!ex || !armBtn(t)) break;
      w.exercises = w.exercises.filter(x => x.id !== exId);
      ui.editSet = null;
      pruneEmpty();
      save();
      renderToday();
      break;
    }

    /* ---- finish workout ---- */
    case 'finish-workout': {
      if (!w || !hasLoggedSets(w) || w.endedAt) break;
      w.endedAt = Date.now();
      hideRest();
      save();
      buzz([80, 60, 180]);
      ensureAudio();       // inside the tap, so the finish chime is allowed
      checkMilestones();
      ui.celebrate = w.id;
      renderToday();
      if (!reducedMotion.matches && state.settings.restSound) beep();   // reuse the rest-timer chime
      runCelebration(w);
      toast('Workout logged. Built, not born.');
      break;
    }

    /* ---- set type cycling (working → warmup → drop → failure) ---- */
    case 'cycle-set-type': {
      if (!ex) break;
      const s = ex.sets[Number(t.dataset.i)];
      if (!s) break;
      const next = SET_TYPES[(SET_TYPES.indexOf(SET_TYPES.includes(s.t) ? s.t : 'working') + 1) % SET_TYPES.length];
      s.t = next;
      save();
      renderToday();
      toast('Set ' + (Number(t.dataset.i) + 1) + ' · ' + (
        next === 'working' ? 'working set' :
        next === 'warmup'  ? 'warm-up — out of PRs & volume' :
        next === 'drop'    ? 'drop set' : 'to failure'));
      break;
    }

    /* ---- plate calculator ---- */
    case 'open-plates': {
      const step = t.closest('.slab-row') ? t.closest('.slab-row').nextElementSibling : null;
      const input = step ? $('input.num', step) : null;
      openPlates(input ? parseFloat(input.value) || 0 : 0);
      break;
    }
    case 'bar-step': {
      const key = unit() === 'lb' ? 'barLb' : 'barKg';
      state.settings[key] = Math.min(200, Math.max(0, Math.round((state.settings[key] + Number(t.dataset.d)) * 100) / 100));
      save();
      renderPlateBody();
      break;
    }

    /* ---- chart metric toggle ---- */
    case 'chart-mode':
      ui.chartMode = t.dataset.m === 'e1rm' ? 'e1rm' : 'top';
      render();
      break;

    /* ---- inline set editing ---- */
    case 'edit-set': {
      if (!ex) break;
      ui.editSet = { exId: ex.id, i: Number(t.dataset.i) };
      renderToday();
      break;
    }
    case 'edit-set-cancel': ui.editSet = null; renderToday(); break;
    case 'edit-set-save': {
      if (!ex || !ui.editSet) break;
      const wt = fromDisp(parseFloat($('.num.ew', card).value) || 0);
      const reps = Math.round(parseFloat($('.num.er', card).value) || 0);
      if (reps < 1) { toast('Reps first'); break; }
      ex.sets[ui.editSet.i] = { w: wt, r: reps, t: ex.sets[ui.editSet.i].t || 'working' };
      ui.editSet = null;
      save();
      renderToday();
      toast('Set updated');
      break;
    }

    /* ---- add exercise (session) ---- */
    case 'open-add-exercise': openAddExercise(); break;
    case 'quick-add-ex':
      if (addExerciseToSession(t.dataset.name)) { closeSheet(); renderToday(); }
      break;
    case 'confirm-add-ex':
      if (addExerciseToSession($('#new-ex-name').value)) { closeSheet(); renderToday(); }
      break;

    /* ---- templates ---- */
    case 'start-template': {
      const tpl = state.templates.find(x => x.id === t.dataset.id);
      if (!tpl) break;
      const session = ensureWorkout(ui.sessionDate);
      const have = new Set(session.exercises.map(x => x.name.toLowerCase().trim()));
      for (const name of tpl.exercises)
        if (!have.has(name.toLowerCase().trim()))
          session.exercises.push({ id: uid(), name, sets: [] });
      tpl.lastUsed = ui.sessionDate;
      save();
      setView('today');
      toast('Loaded ' + tpl.name);
      break;
    }
    case 'new-template': openTplEditor({ name: '', exercises: [] }); break;
    case 'edit-template': {
      const tpl = state.templates.find(x => x.id === t.dataset.id);
      if (tpl) openTplEditor({ id: tpl.id, name: tpl.name, exercises: [...tpl.exercises] });
      break;
    }
    case 'del-template': {
      if (!armBtn(t)) break;
      state.templates = state.templates.filter(x => x.id !== t.dataset.id);
      save();
      if (ui.view === 'templates') renderTemplates(); else render();
      toast('Template deleted');
      break;
    }
    case 'save-as-template': {
      const session = getWorkout(ui.sessionDate);
      if (!session || !session.exercises.length) break;
      openTplEditor({ name: '', exercises: session.exercises.map(x => x.name) });
      break;
    }

    /* ---- template editor internals ---- */
    case 'tpl-add': {
      syncTplName();
      const input = $('#tpl-add-input');
      const name = input.value.trim();
      if (!name) break;
      if (ui.tplDraft.exercises.some(n => n.toLowerCase().trim() === name.toLowerCase())) { toast('Already in the list'); break; }
      ui.tplDraft.exercises.push(name);
      renderTplBody();
      break;
    }
    case 'tpl-chip':
      syncTplName();
      ui.tplDraft.exercises.push(t.dataset.name);
      renderTplBody();
      break;
    case 'tpl-remove':
      syncTplName();
      ui.tplDraft.exercises.splice(Number(t.dataset.i), 1);
      renderTplBody();
      break;
    case 'tpl-save': {
      syncTplName();
      const d = ui.tplDraft;
      if (!d.name.trim()) { toast('Name it first'); break; }
      if (!d.exercises.length) { toast('Add at least one exercise'); break; }
      if (d.id) {
        const tpl = state.templates.find(x => x.id === d.id);
        if (tpl) { tpl.name = d.name.trim(); tpl.exercises = d.exercises; }
      } else {
        state.templates.push({ id: uid(), name: d.name.trim(), exercises: d.exercises, lastUsed: null });
      }
      save();
      closeSheet();
      if (ui.view === 'templates' || ui.view === 'today') render();
      toast('Template saved');
      break;
    }

    /* ---- calendar ---- */
    case 'cal-shift': {
      ui.calM += Number(t.dataset.d);
      if (ui.calM < 0)  { ui.calM = 11; ui.calY--; }
      if (ui.calM > 11) { ui.calM = 0;  ui.calY++; }
      renderCalendar();
      break;
    }
    case 'cal-day':
      ui.sessionDate = t.dataset.date;
      ui.editSet = null;
      setView('today');
      break;

    /* ---- bodyweight ---- */
    case 'log-bw': {
      const kg = fromDisp(parseFloat($('.num.bw').value) || 0);
      if (!kg || kg <= 0) { toast('Enter your weight first'); break; }
      const d = ui.bwDate || todayStr();
      const wasEdit = !!ui.bwEditing;
      if (ui.bwEditing && ui.bwEditing !== d)
        state.bodyweight = state.bodyweight.filter(b => b.date !== ui.bwEditing);
      const existing = state.bodyweight.find(b => b.date === d);
      if (existing) existing.kg = kg; else state.bodyweight.push({ date: d, kg });
      ui.bwEditing = null;
      save();
      renderBody();
      toast((wasEdit ? 'Updated · ' : 'Logged ') + dispW(kg) + ' ' + unit() + ' · ' + fmtShort(d));
      break;
    }
    case 'edit-bw':
      ui.bwDate = t.dataset.date;
      ui.bwEditing = t.dataset.date;
      renderBody();
      window.scrollTo({ top: 0 });
      break;
    case 'bw-cancel-edit':
      ui.bwEditing = null;
      ui.bwDate = todayStr();
      renderBody();
      break;
    case 'del-bw':
      state.bodyweight = state.bodyweight.filter(b => b.date !== t.dataset.date);
      if (ui.bwEditing === t.dataset.date) ui.bwEditing = null;
      save();
      renderBody();
      break;

    /* ---- settings ---- */
    case 'set-unit': {
      const u = t.dataset.u;
      if (u !== state.settings.unit) {
        state.settings.unit = u;
        save();
        render();
        openSettings();
        toast('Units: ' + u);
      }
      break;
    }
    case 'set-sound':
      state.settings.restSound = t.dataset.v === '1';
      save();
      openSettings();
      break;
    case 'set-oled':
      state.settings.oled = t.dataset.v === '1';
      save();
      applyTheme();
      openSettings();
      break;
    case 'goal-step': {
      const g = Math.min(14, Math.max(1, state.settings.weeklyGoal + Number(t.dataset.d)));
      if (g === state.settings.weeklyGoal) break;
      state.settings.weeklyGoal = g;
      save();
      const el = $('#goal-num');
      if (el) el.textContent = g;
      render();   // the view under the sheet shows the goal bar
      break;
    }
    case 'install-app': {
      const p = deferredInstall;
      if (!p) break;
      deferredInstall = null;
      pwa.canInstall = false;
      p.prompt();
      if (p.userChoice) p.userChoice.catch(() => {});
      break;
    }

    /* ---- rest timer ---- */
    case 'rest-start': startRest(Number(t.dataset.s)); break;
    case 'rest-custom': showRestCustom(); break;
    case 'rest-start-custom': {
      const el = $('#rest-custom-s');
      const v = el ? parseFloat(el.value) : 0;
      if (!v || v < 5) { toast('At least 5 seconds'); break; }
      startRest(v);
      break;
    }
    case 'rest-pause': toggleRestPause(); break;
    case 'rest-skip':
    case 'rest-hide': hideRest(); break;

    /* ---- data ---- */
    case 'export-json': exportJSON(); break;
    case 'import-json': $('#import-file').click(); break;
  }
});

/* ---------------- change handlers (date, select, file, exercise meta) ---------------- */
document.addEventListener('change', e => {
  if (!state) return;
  const el = e.target;
  if (el.id === 'session-date') { ui.sessionDate = el.value || todayStr(); ui.editSet = null; renderToday(); }
  else if (el.id === 'progress-ex') { ui.progressEx = el.value; renderProgress(); }
  else if (el.id === 'bw-date') { ui.bwDate = el.value || todayStr(); renderBody(); }
  else if (el.id === 'import-file') handleImportFile(el);
  else if (el.id === 'ex-muscle' && ui.exName) {
    ensureMeta(ui.exName).muscle = el.value;
    save();
    toast(el.value ? 'Tagged ' + el.value : 'Back to auto tag');
  }
  else if (el.id === 'ex-notes' && ui.exName) {
    ensureMeta(ui.exName).notes = el.value.slice(0, 4000);
    save();
  }
});

/* Enter = the obvious action in each text field. */
document.addEventListener('keydown', e => {
  if (!state || e.key !== 'Enter') return;
  if (e.target.id === 'new-ex-name') { e.preventDefault(); $('[data-action="confirm-add-ex"]').click(); }
  if (e.target.id === 'tpl-add-input') { e.preventDefault(); $('[data-action="tpl-add"]').click(); }
  if (e.target.id === 'rest-custom-s') { e.preventDefault(); $('[data-action="rest-start-custom"]').click(); }
});

/* ---------------- chart micro-tooltips (tap or focus+Enter a dot) ---------------- */
function showChartTip(dot) {
  const wrap = dot.closest('.chart-wrap');
  if (!wrap) return;
  let tip = $('.chart-tip', wrap);
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; wrap.appendChild(tip); }
  tip.innerHTML = `<div class="tip-main">${esc(dot.dataset.tip || '')}</div>` +
                  (dot.dataset.sub ? `<div class="tip-sub">${esc(dot.dataset.sub)}</div>` : '');
  const r = dot.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  let x = r.left - wr.left + r.width / 2 - tip.offsetWidth / 2;
  x = Math.max(6, Math.min(wr.width - tip.offsetWidth - 6, x));
  let y = r.top - wr.top - tip.offsetHeight - 6;
  if (y < 2) y = r.top - wr.top + r.height + 6;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
document.addEventListener('click', e => {
  const el = e.target instanceof Element ? e.target : null;
  const dot = el && el.closest('.chart-dot');
  if (dot) showChartTip(dot);
  else $$('.chart-tip').forEach(t => t.remove());   // tap anywhere else dismisses
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof Element && e.target.classList.contains('chart-dot')) {
    e.preventDefault();
    showChartTip(e.target);
  }
});

/* ---------------- go ---------------- */
(async function boot() {
  state = await loadInitial();
  applyTheme();
  render();
  setupPWA();
})();
</script>
